name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install -r backend/requirements.txt
      - run: python scripts/check_secrets.py
      - run: PYTHONPATH=backend python -m compileall -q backend server_earthscope.py earthscope_backend.py
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: PYTHONPATH=backend python scripts/acceptance_check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --input-type=module --check < web/earth-model.js
      - run: node --input-type=module --check < web/command-center.js
      - run: node --check web/earthscope-station.js
      - run: node --check web/api/proxy.js
      - run: node scripts/check_proxy_compat.js
      - name: Extract and syntax-check research dashboard scripts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('web/dashboard/research.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script\b([^>]*)>(.*?)</script>', html, flags=re.I | re.S)
          inline = [(attrs, body) for attrs, body in matches if not re.search(r'\bsrc\s*=', attrs, flags=re.I)]
          if not inline:
              raise SystemExit('No inline JavaScript found in research dashboard')
          modules = [body for attrs, body in inline if re.search(r'\btype\s*=\s*["\']module["\']', attrs, flags=re.I)]
          classic = [body for attrs, body in inline if not re.search(r'\btype\s*=\s*["\']module["\']', attrs, flags=re.I)]
          if modules:
              Path('/tmp/earthscope-research-module.mjs').write_text('\n'.join(modules), encoding='utf-8')
          if classic:
              Path('/tmp/earthscope-research-inline.js').write_text('\n'.join(classic), encoding='utf-8')
          PY
          if [ -f /tmp/earthscope-research-module.mjs ]; then node --check /tmp/earthscope-research-module.mjs; fi
          if [ -f /tmp/earthscope-research-inline.js ]; then node --check /tmp/earthscope-research-inline.js; fi
